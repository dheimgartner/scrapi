site_name: scrapi
site_description: Scrape information from multiple sources and analyse it with an LLM
repo_name: dheimgartner/scrapi
repo_url: https://github.com/dheimgartner/scrapi

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_category_heading: true
            members_order: source

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Configuration: configuration.md
  - API Reference:
    - Overview: api/index.md
    - Orchestrator: api/orchestrator.md
    - Factory: api/factory.md
    - Inference: api/inference.md
    - Scrapers: api/scrapers.md
    - LLM Providers: api/llm.md
    - Models: api/models.md
    - Renderer: api/renderer.md
    - Config Schemas: api/config.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
