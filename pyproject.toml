[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapi"
version = "0.0.0"
description = "Scrape information and analyze it with a LLM"
readme = "README.md"
requires-python = ">=3.12"
#license = { file = "LICENSE" }
authors = [{name = "Dominik Lehmann", email = "dominik.lehmann@finma.ch"}, { name = "Daniel Heimgartner", email = "daniel.heimgartner@finma.ch" }]
dependencies = [
    "beautifulsoup4",
    "chainlit",
    "ddgs",
    "httpx",
    "langchain",
    "langchain_core",
    "langchain_openai",
    "langgraph",
    "markitdown",
    "primp",
    "psutil",
    "px-proxy",
    "pydantic",
    "pyyaml",
    "selenium",
    "SQLAlchemy",
    "tqdm",
    "truststore",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "pipreqs",
]

[tool.setuptools.packages.find]
where = ["."]
